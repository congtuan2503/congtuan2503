name: Log activity

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform"
        required: true
        type: choice
        options:
          - kc7
          - letsdefend
      count:
        description: "How many cases/alerts today"
        required: false
        default: "1"
      note:
        description: "Optional note (for your own reference only)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Append entry and rebuild heatmap
        env:
          PLATFORM: ${{ inputs.platform }}
          COUNT: ${{ inputs.count }}
          NOTE: ${{ inputs.note }}
        run: |
          python3 log_activity.py
          python3 generate_heatmap.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add activity_log.json assets/activity_heatmap.svg
          git diff --cached --quiet || git commit -m "log: ${{ inputs.platform }} activity"
          git push
