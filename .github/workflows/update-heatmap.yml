name: Update activity heatmap

on:
  push:
    paths:
      - "activity_log.json"
      - "generate_heatmap.py"
  workflow_dispatch: {}
  schedule:
    # Re-render weekly even with no new commits, so the "current streak"
    # text doesn't go stale.
    - cron: "0 0 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate heatmap
        run: python3 generate_heatmap.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/activity_heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh activity heatmap"
          git push
